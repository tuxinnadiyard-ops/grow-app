services:
  postgres:
    image: postgres:17
    container_name: grow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grow
      POSTGRES_PASSWORD: growpassword
      POSTGRES_DB: growdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: